# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

build:
  dockerBuildPath: ../..
startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      memoryFilePath:
        type: string
        default: memory.json
        description: Path to the memory storage JSON file used by the server.
  exampleConfig:
    memoryFilePath: memory.json
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        MEMORY_FILE_PATH: config.memoryFilePath
      }
    })
